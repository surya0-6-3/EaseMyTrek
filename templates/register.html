{% from "macros.html" import csrf %}
{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card"><div class="card-body">
      <h1 class="h4 mb-3">Create an Account</h1>
      <form method="post" novalidate>
        {{ csrf() }}
        <div class="mb-3">
          <label for="name" class="form-label">Full name</label>
          <input type="text" class="form-control" id="name" name="name" maxlength="100" value="{{ name or '' }}" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password (at least 8 characters)</label>
          <input type="password" class="form-control" id="password" name="password" minlength="8" required>
        </div>
        <div class="mb-3">
          <label for="confirm_password" class="form-label">Confirm password</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
        </div>
        <button type="submit" class="btn btn-forest">Register</button>
      </form>
      <p class="mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
