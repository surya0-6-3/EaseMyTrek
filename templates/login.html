{% from "macros.html" import csrf %}
{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card"><div class="card-body">
      <h1 class="h4 mb-3">Login</h1>
      <form method="post" novalidate>
        {{ csrf() }}
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-forest">Login</button>
      </form>
      <p class="mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
